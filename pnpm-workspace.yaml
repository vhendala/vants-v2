packages:
  - "apps/*"
  - "packages/*"
  - "packages/adapters/*"

# Install scripts stay off for optional native/codegen deps (testcontainers, the Stellar SDK, and the Wallets Kit's
# WalletConnect stack; all have pure-JS fallbacks).
allowBuilds:
  "@reown/appkit": false
  bufferutil: false
  cpu-features: false
  esbuild: false
  protobufjs: false
  secp256k1: false
  ssh2: false
  utf-8-validate: false
