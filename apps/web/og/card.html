      :root {

      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 40% 50%; display: block; }
      .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, oklch(18% 0.022 218 / 0) 70%, oklch(18% 0.022 218 / 0.9)); }
      .copy { display: flex; flex-direction: column; padding: 64px 64px 60px 44px; }
      .logo { height: 44px; width: 134px; }
      h1 {
        margin-top: auto;
        font-family: "Bricolage Grotesque", Manrope, sans-serif;
        font-size: 60px; line-height: 1.02; font-weight: 700; letter-spacing: -0.035em;
      }
      p { margin-top: 22px; font-size: 24px; line-height: 1.38; font-weight: 500; color: oklch(86% 0.006 250); }
