[package]
name = "vants-exit-router"
version = "0.1.0"
edition = "2021"
publish = false
description = "Vants exit router: one Soroban call, one signature, per payment (SPEC DEC-031)"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "=29.0.1"

[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
