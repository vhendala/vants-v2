# Hosted Vants backend on one small VM (T-027, DEC-045): Postgres, the API, the worker and Caddy for HTTPS.
# Secrets live in /opt/vants/.env on the VM only (written by deploy/push.sh, never committed). Exactly ONE worker runs:
# two would race for the same deposits and payouts.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-vants: &vants
  image: vants:${VANTS_VERSION:?set in .env}
  env_file: .env
  environment:
    DATABASE_URL: postgres://vants:${POSTGRES_PASSWORD}@postgres:5432/vants
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  mem_limit: 512m
  logging: *logging

services:
  postgres:
    image: postgres:18.6
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=60"]
    environment:
      POSTGRES_USER: vants
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: vants
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vants -d vants"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  api:
    <<: *vants
    command: ["node", "apps/api/src/main.ts"]

  worker:
    <<: *vants
    command: ["node", "apps/worker/src/main.ts"]

  caddy:
    image: caddy:2.11.7-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      VANTS_HOST: ${VANTS_HOST:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
